<div class="flex flex-col md:flex-row md:items-center md:gap-6 gap-4">
  <!-- Search Box -->
  <div class="flex-1 relative">
    <label class="sr-only">Search</label>

    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"> 🔍 </span>

    <input
      type="search"
      [formControl]="searchControl"
      placeholder="Search products, SKU…"
      class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300/60 bg-white/90 shadow-sm focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400 transition-all"
    />
  </div>

  <!-- Filters Row -->
  <div class="flex items-center flex-wrap gap-3">
    <!-- Category -->
    <select
      class="px-4 py-2.5 rounded-xl border border-gray-300/60 bg-white/90 shadow-sm focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400 transition-all"
      [(ngModel)]="category"
      (ngModelChange)="emitChange()"
    >
      <option value="">All categories</option>
      <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
    </select>

    <!-- Stock -->
    <select
      class="px-4 py-2.5 rounded-xl border border-gray-300/60 bg-white/90 shadow-sm focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400 transition-all"
      [(ngModel)]="stock"
      (ngModelChange)="emitChange()"
    >
      <option value="">All stock</option>
      <option value="in">In stock</option>
      <option value="out">Out of stock</option>
      <option value="low">Low stock (&lt;10)</option>
    </select>

    <!-- Sorting -->
    <select
      class="px-4 py-2.5 rounded-xl border border-gray-300/60 bg-white/90 shadow-sm focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400 transition-all"
      [(ngModel)]="sort"
      (ngModelChange)="emitChange()"
    >
      <option value="">Sort</option>
      <option value="price_asc">Price: Low → High</option>
      <option value="price_desc">Price: High → Low</option>
      <option value="name_asc">Name: A → Z</option>
      <option value="name_desc">Name: Z → A</option>
    </select>

    <!-- Reset -->
    <button
      class="px-4 py-2.5 rounded-xl border border-gray-300/60 bg-white hover:bg-gray-50 shadow-sm text-gray-700 transition active:scale-95"
      (click)="reset()"
    >
      Reset
    </button>
  </div>
</div>
