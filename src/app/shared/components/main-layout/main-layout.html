<div class="flex h-screen bg-gray-100">
  <!-- Mobile Sidebar Overlay -->
  <div
    class="fixed inset-0 bg-black-100 bg-opacity-40 z-40 md:hidden"
    *ngIf="open"
    (click)="toggleSidebar()"
  ></div>

  <!-- Sidebar -->
  <aside
    class="fixed md:static z-50 top-0 left-0 h-full w-64 bg-white shadow-md p-4 transform transition-transform duration-300"
    [class.-translate-x-full]="!open && isMobile"
  >
    <h2 class="text-xl font-semibold mb-6">Stock Pilot</h2>

    <nav class="space-y-3">
      <a
        [routerLink]="['/']"
        routerLinkActive="bg-gray-200 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-2 p-2 rounded hover:bg-gray-200"
      >
        <ng-icon name="lucideHome" class="w-5 h-5 text-gray-600"></ng-icon>
        <span>Dashboard</span>
      </a>

      <a
        [routerLink]="['/products/list']"
        routerLinkActive="bg-gray-200 font-semibold"
        class="flex items-center gap-2 p-2 rounded hover:bg-gray-200"
      >
        <ng-icon name="lucidePackage" class="w-5 h-5 text-gray-600"></ng-icon>
        <span>Products</span>
      </a>

      <a
        [routerLink]="['/orders']"
        routerLinkActive="bg-gray-200 font-semibold"
        class="flex items-center gap-2 p-2 rounded hover:bg-gray-200"
      >
        <ng-icon name="lucideShoppingCart" class="w-5 h-5 text-gray-600"></ng-icon>
        <span>Orders</span>
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col">
    <!-- Top Bar -->
    <header class="bg-white shadow p-4 flex items-center gap-4 md:hidden">
      <button class="p-2 rounded border shadow" (click)="toggleSidebar()">☰</button>
      <h2 class="text-xl font-semibold">Stock Pilot</h2>
    </header>

    <!-- Content -->
    <div class="flex-1 p-6 overflow-auto">
      <router-outlet />
    </div>
  </main>
</div>
