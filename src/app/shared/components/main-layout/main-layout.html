<div class="flex h-screen bg-gray-50 text-gray-800">
  <!-- ===== MOBILE SIDEBAR OVERLAY ===== -->
  <div
    *ngIf="open"
    class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 md:hidden animate-fadeIn"
    (click)="toggleSidebar()"
  ></div>

  <!-- ===== SIDEBAR ===== -->
  <aside
    class="fixed md:static z-50 top-0 left-0 h-full w-64 bg-white shadow-xl rounded-r-2xl transition-all duration-300 ease-in-out flex flex-col"
    [class.-translate-x-full]="!open && isMobile"
  >
    <!-- Logo -->
    <div class="p-6 shadow-sm rounded-br-xl">
      <h2 class="text-2xl text-center font-bold tracking-tight">Stock Pilot</h2>
    </div>

    <!-- NAVIGATION -->
    <nav class="flex-1 overflow-y-auto p-4 space-y-2">
      <!-- Dashboard -->
      <a
        [routerLink]="['/']"
        routerLinkActive="bg-gray-100 text-gray-900 shadow-sm"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 transition-all group"
      >
        <ng-icon
          name="lucideHome"
          class="w-5 h-5 text-gray-500 group-hover:text-gray-700"
        ></ng-icon>
        <span class="font-medium">Dashboard</span>
      </a>

      <!-- Products -->
      <a
        [routerLink]="['/products/list']"
        routerLinkActive="bg-gray-100 text-gray-900 shadow-sm"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 transition-all group"
      >
        <ng-icon
          name="lucidePackage"
          class="w-5 h-5 text-gray-500 group-hover:text-gray-700"
        ></ng-icon>
        <span class="font-medium">Products</span>
      </a>

      <!-- Orders -->
      <a
        [routerLink]="['/orders']"
        routerLinkActive="bg-gray-100 text-gray-900 shadow-sm"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 transition-all group"
      >
        <ng-icon
          name="lucideShoppingCart"
          class="w-5 h-5 text-gray-500 group-hover:text-gray-700"
        ></ng-icon>
        <span class="font-medium">Orders</span>
      </a>
    </nav>
  </aside>

  <!-- ===== MAIN CONTENT AREA ===== -->
  <main class="flex-1 flex flex-col">
    <!-- TOP NAVBAR (MOBILE) -->
    <header
      class="bg-white shadow-md md:hidden sticky top-0 z-20 flex items-center p-4 rounded-b-2xl"
    >
      <!-- Sidebar Toggle -->
      <button (click)="toggleSidebar()" class="p-2 rounded-lg bg-white hover:bg-gray-100">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <h1 class="text-2xl font-semibold mx-2">Stock Pilot</h1>
    </header>

    <!-- CONTENT -->
    <div class="flex-1 overflow-auto p-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
