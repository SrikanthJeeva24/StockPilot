<article class="bg-white rounded-lg shadow-sm overflow-hidden border">
  <div class="h-40 bg-gray-50 flex items-center justify-center">
    <img
      *ngIf="product.image; else placeholder"
      [src]="product.image"
      class="object-contain h-40 w-full"
      alt="{{ product.name }}"
    />
    <ng-template #placeholder>
      <div class="w-24 h-24 rounded bg-gray-200 flex items-center justify-center text-gray-500">
        <!-- simple placeholder -->
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M8 14l2-2 2 2 4-4"></path>
        </svg>
      </div>
    </ng-template>
  </div>

  <div class="p-4">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h3 class="text-sm md:text-base font-semibold text-gray-800 truncate">
          {{ product.name }}
        </h3>
        <p class="text-xs text-gray-500 mt-1">{{ product.sku || '' }}</p>
      </div>
      <div class="text-right">
        <div class="text-sm md:text-base font-semibold">₹ {{ product.price | number }}</div>
        <div [ngClass]="product.stock > 0 ? 'text-green-600' : 'text-red-500'" class="text-xs mt-1">
          {{ product.stock > 0 ? (product.stock < 10 ? 'Low stock' : 'In stock') : 'Out of stock' }}
        </div>
      </div>
    </div>

    <div class="mt-3 flex items-center justify-between">
      <span class="text-xs px-2 py-1 bg-gray-100 rounded">{{ product.category || '—' }}</span>
      <div class="flex gap-2">
        <button class="text-xs px-2 py-1 border rounded hover:bg-gray-50">View</button>
        <button class="text-xs px-2 py-1 border rounded hover:bg-gray-50">Edit</button>
      </div>
    </div>
  </div>
</article>
