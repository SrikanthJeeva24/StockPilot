<article
  class="bg-white/90 backdrop-blur-sm rounded-2xl border border-gray-200 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 overflow-hidden"
>
  <!-- Image -->
  <div class="h-44 bg-gray-50 border-b border-gray-100 flex items-center justify-center relative">
    <img
      *ngIf="product.image; else placeholder"
      [src]="product.image"
      class="object-contain h-full w-full p-4 transition-transform duration-300 hover:scale-105"
      alt="{{ product.name }}"
    />

    <ng-template #placeholder>
      <div
        class="w-28 h-28 rounded-xl bg-gray-200 flex items-center justify-center text-gray-500 shadow-inner"
      >
        <svg class="w-10 h-10 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M8 14l2-2 2 2 4-4"></path>
        </svg>
      </div>
    </ng-template>

    <!-- Stock badge -->
    <span
      class="absolute top-3 right-3 text-xs px-2 py-1 rounded-md shadow-sm backdrop-blur-md"
      [ngClass]="
        product.stock > 0
          ? product.stock < 10
            ? 'bg-yellow-100 text-yellow-700'
            : 'bg-green-100 text-green-700'
          : 'bg-red-100 text-red-700'
      "
    >
      {{ product.stock > 0 ? (product.stock < 10 ? 'Low' : 'In Stock') : 'Out' }}
    </span>
  </div>

  <!-- Content -->
  <div class="p-5 space-y-4">
    <div class="flex items-start justify-between gap-4">
      <div class="flex-1 min-w-0">
        <h3 class="text-base font-semibold text-gray-900 leading-tight line-clamp-1">
          {{ product.name }}
        </h3>
        <p class="text-xs text-gray-500 mt-1 line-clamp-1">{{ product.sku }}</p>
      </div>

      <div class="text-right shrink-0">
        <div class="text-base font-semibold text-gray-900">₹ {{ product.price | number }}</div>
      </div>
    </div>

    <!-- Category + Actions -->
    <div class="flex items-center justify-between">
      <span class="text-xs px-2 py-1 rounded-md bg-gray-100 text-gray-700 border border-gray-200">
        {{ product.category || '—' }}
      </span>

      <div class="flex items-center gap-2">
        <!-- View Button -->
        <button
          [routerLink]="['/products/edit', product.id]"
          class="text-xs px-3 py-1.5 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 active:scale-95 transition shadow-sm"
        >
          View
        </button>

        <!-- Delete Icon Button -->
        <button
          (click)="openDeleteModal(product)"
          class="p-2 rounded-lg border border-red-300/50 bg-red-50 text-red-600 hover:bg-red-100 active:scale-95 transition shadow-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 7h12M9 7v10m6-10v10M4 7h16l-1 13H5L4 7zM10 4h4l1 2H9l1-2z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</article>

<!-- Delete Modal -->
<div
  *ngIf="showDeleteModal"
  class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm animate-[fadeIn_0.2s_ease-out]">
    <h3 class="text-lg font-semibold text-gray-900">Delete Product?</h3>
    <p class="text-gray-500 text-sm mt-2">
      Are you sure you want to delete <strong>{{ selectedProduct?.name }}</strong
      >? This action cannot be undone.
    </p>

    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="closeDeleteModal()"
        class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 transition"
      >
        Cancel
      </button>

      <button
        (click)="confirmDelete()"
        class="px-4 py-2 rounded-xl bg-red-600 text-white hover:bg-red-700 transition shadow-sm active:scale-95"
      >
        Delete
      </button>
    </div>
  </div>
</div>
