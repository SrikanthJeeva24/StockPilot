<div
  class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default"
>
  <!-- Top Bar: Search + Filter -->
  <div class="p-4 flex items-center justify-between space-x-4">
    <!-- SEARCH BAR -->
    <label for="input-group-1" class="sr-only">Search</label>

    <div class="relative w-full">
      <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
        <svg
          class="w-4 h-4 text-body"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
            d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
          />
        </svg>
      </div>

      <input
        type="text"
        id="input-group-1"
        [(ngModel)]="searchQuery"
        (change)="applySearch()"
        placeholder="Search..."
        class="block w-full ps-9 pe-3 py-2 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
      />
    </div>

  <!-- TABLE -->
  <table class="w-full text-sm text-left rtl:text-right text-body">
    <thead class="text-sm text-body bg-neutral-secondary-medium border-b border-default-medium">
      <tr>
        <!-- TABLE HEADERS -->
        <th
          *ngFor="let col of columns"
          scope="col"
          class="px-6 py-3 cursor-pointer select-none"
          (click)="col.sortable !== false && sortColumn(col.field)"
          (keydown)="$event.key === 'Enter' && col.sortable !== false && sortColumn(col.field)"
          tabindex="0"
        >
          <div class="flex items-center justify-center">
            {{ col.header }}

            <!-- Sort Icon -->
            <!-- <div *ngIf="sortField === col.field">
              <svg
                class="w-4 h-4 ms-1"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m8 15 4 4 4-4m0-6-4-4-4 4"
                />
              </svg>
            </div> -->
          </div>
        </th>

        <th scope="col" class="px-6 py-3 flex items-center justify-center">Action</th>
      </tr>
    </thead>

    <tbody>
      <tr
        *ngFor="let row of pagedData"
        class="bg-neutral-primary-soft border-b border-default hover:bg-neutral-secondary-medium"
      >
        <!-- Row Columns -->
        <td *ngFor="let col of columns" class="px-6 py-4 whitespace-nowrap">
          <span
            *ngIf="col.isLink"
            class="font-bold cursor-pointer"
            [routerLink]="formatLink(col.link, row)"
          >
            {{ row[col.field] }}
          </span>
          <span *ngIf="!col.isLink" class="font-medium">
            {{ row[col.field] }}
          </span>
        </td>

        <!-- Actions -->
        <td class="px-6 py-4 flex items-center justify-center">
          <button
            class="font-medium mx-2 text-fg-brand hover:underline"
            (click)="onAction('edit', row)"
          >
            Edit
          </button>

          <button
            class="font-medium text-fg-danger hover:underline"
            (click)="onAction('delete', row)"
          >
            Remove
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- PAGINATION -->
  <nav
    class="flex items-center flex-column flex-wrap md:flex-row justify-between p-4"
    aria-label="Table navigation"
  >
    <span class="text-sm font-normal text-body mb-4 md:mb-0 block w-full md:inline md:w-auto">
      Showing <span class="font-semibold text-heading">{{ (page - 1) * pageSize + 1 }}</span> –
      <span class="font-semibold text-heading">{{ Math.min(page * pageSize, data.length) }}</span>
      of <span class="font-semibold text-heading">{{ data.length }}</span>
    </span>

    <ul class="flex -space-x-px text-sm">
      <li>
        <button
          (click)="changePage(false)"
          [disabled]="page === 1"
          class="flex items-center justify-center text-body bg-neutral-secondary-medium border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-s-base text-sm px-3 h-9 disabled:opacity-40"
        >
          Previous
        </button>
      </li>

      <li>
        <button
          (click)="changePage(true)"
          [disabled]="page >= Math.ceil(data.length / pageSize)"
          class="flex items-center justify-center text-body bg-neutral-secondary-medium border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-e-base text-sm px-3 h-9 disabled:opacity-40"
        >
          Next
        </button>
      </li>
    </ul>
  </nav>
</div>
