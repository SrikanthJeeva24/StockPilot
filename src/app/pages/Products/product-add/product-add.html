<!-- PAGE HEADER -->
<header
  class="sticky top-0 z-30 bg-white/70 backdrop-blur-xl border-b border-gray-200/50 shadow-sm"
>
  <div class="px-4 md:px-8 py-5 flex items-center justify-between">
    <!-- Title -->
    <h2 class="text-2xl font-semibold text-gray-900 tracking-tight flex items-center gap-3">
      Add Product
    </h2>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <!-- Back Button (Soft Premium) -->
      <button
        [routerLink]="['/products/list']"
        class="px-4 py-2.5 rounded-xl border border-gray-300/70 bg-white/80 text-gray-700 text-sm font-medium shadow-sm hover:bg-gray-100 hover:border-gray-400 active:scale-95 transition-all backdrop-blur-sm"
      >
        Back
      </button>

      <!-- Save Button (High Contrast Premium CTA) -->
      <button
        class="px-5 py-2.5 rounded-xl bg-gray-900 text-white text-sm font-medium shadow-sm hover:bg-gray-800 active:scale-95 transition"
        (click)="submit()"
      >
        Save Product
      </button>
    </div>
  </div>
</header>

<!-- FULL PAGE FORM -->
<section class="p-4 md:p-8 max-w-6xl mx-auto">
  <div
    class="bg-white/80 backdrop-blur-xl border border-gray-200/60 shadow-lg rounded-2xl p-6 md:p-8"
  >
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- LEFT: Images -->
      <div class="space-y-4">
        <h3 class="text-lg font-semibold text-gray-800">Product Images</h3>

        <!-- Upload Box -->
        <label
          class="flex flex-col items-center justify-center h-40 w-full border-2 border-dashed border-gray-300 rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition"
        >
          <input
            type="file"
            accept="image/*"
            class="hidden"
            (change)="onImageSelect($event)"
            multiple
          />
          <span class="text-gray-500 text-sm">Click to upload images</span>
        </label>

        <!-- Preview Grid -->
        <div *ngIf="productImages.length! > 0" class="grid grid-cols-3 gap-3">
          <div *ngFor="let img of productImages; let i = index" class="relative group">
            <img
              [src]="img"
              [alt]="'product-img-' + i"
              class="w-full h-24 object-cover rounded-xl border shadow-sm"
            />
            <!-- Delete Button -->
            <button
              (click)="removeImage(i)"
              class="absolute top-1 right-1 bg-black/60 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition"
            >
              ✕
            </button>
          </div>
        </div>
      </div>

      <!-- RIGHT: Details Form -->
      <div class="lg:col-span-2">
        <form [formGroup]="productForm" (ngSubmit)="submit()" class="space-y-6">
          <!-- Product Name -->
          <div class="space-y-1">
            <label for="productName" class="text-sm font-medium text-gray-700">
              Product Name
            </label>

            <input
              id="productName"
              formControlName="name"
              type="text"
              placeholder="Apple iPhone 15 Pro Max"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-300 bg-white focus:ring-2 focus:ring-gray-900/10 transition"
            />

            <small
              *ngIf="productForm.get('name')?.touched && productForm.get('name')?.invalid"
              class="text-red-600 text-xs"
            >
              Name is required
            </small>
          </div>

          <!-- SKU -->
          <div class="space-y-1">
            <label for="sku" class="text-sm font-medium text-gray-700">SKU</label>
            <input
              id="sku"
              formControlName="sku"
              type="text"
              placeholder="IP15PRO-256-BLK"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-300 bg-white focus:ring-2 focus:ring-gray-900/10 transition"
            />
            <small
              *ngIf="productForm.get('sku')?.touched && productForm.get('sku')?.invalid"
              class="text-red-600 text-xs"
              >SKU is required</small
            >
          </div>

          <!-- Price & Stock -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-1">
              <label for="price" class="text-sm font-medium text-gray-700">Price (₹)</label>
              <input
                id="price"
                formControlName="price"
                type="number"
                placeholder="79999"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 bg-white focus:ring-2 focus:ring-gray-900/10 transition"
              />
              <small
                *ngIf="productForm.get('price')?.touched && productForm.get('price')?.invalid"
                class="text-red-600 text-xs"
                >Price is required</small
              >
            </div>

            <div class="space-y-1">
              <label for="stock" class="text-sm font-medium text-gray-700">Stock Qty</label>
              <input
                id="stock"
                formControlName="stock"
                type="number"
                placeholder="50"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 bg-white focus:ring-2 focus:ring-gray-900/10 transition"
              />
              <small
                *ngIf="productForm.get('stock')?.touched && productForm.get('stock')?.invalid"
                class="text-red-600 text-xs"
                >Stock is required</small
              >
            </div>
          </div>

          <!-- Category -->
          <div class="space-y-1">
            <label for="category" class="text-sm font-medium text-gray-700">Category</label>
            <select
              id="category"
              formControlName="categoryid"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-300 bg-white focus:ring-2 focus:ring-gray-900/10 transition"
            >
              <option value="">Select category</option>
              <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
            </select>
            <small
              *ngIf="productForm.get('category')?.touched && productForm.get('category')?.invalid"
              class="text-red-600 text-xs"
              >Category is required</small
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
