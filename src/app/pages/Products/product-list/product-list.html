<!-- Page Header (Child Component) -->
<header class="top-0 bg-white rounded-xl p-4 mb-4 flex items-center justify-between">
  <h1 class="text-2xl font-semibold tracking-tight">
    Products <span class="text-gray-400 text-lg">({{ products.length }})</span>
  </h1>

  <button
    type="button"
    [routerLink]="['/products/add']"
    class="text-white bg-gray-800 hover:bg-gray-700 shadow-md font-medium rounded-lg text-sm px-4 py-2"
  >
    + Add New Product
  </button>
</header>

<section class="space-y-6">
  <!-- Loading State -->
  <div *ngIf="loading" class="py-20 flex flex-col items-center gap-3">
    <div
      class="h-8 w-8 border-[3px] border-gray-300 border-t-gray-900 rounded-full animate-spin"
    ></div>
    <p class="text-sm text-gray-500">Loading your products…</p>
  </div>

  <!-- Empty State -->
  <div
    *ngIf="!loading && products.length === 0"
    class="py-24 text-center flex flex-col items-center gap-3"
  >
    <div class="text-6xl opacity-80">📦</div>
    <p class="text-xl font-semibold text-gray-800">No Products Found</p>
    <p class="text-sm text-gray-400">Try adding a new product.</p>
  </div>

  <!-- ========================= -->
  <!-- DESKTOP TABLE (md+)       -->
  <!-- ========================= -->
  <div class="hidden md:block">
    <dynamicTable
      *ngIf="!loading && products.length > 0"
      [columns]="columns"
      [data]="products"
      (sort)="handleSort($event)"
      (action)="handleAction($event)"
    ></dynamicTable>
  </div>

  <!-- ========================= -->
  <!-- MOBILE PRODUCT CARDS      -->
  <!-- ========================= -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:hidden">
    <div
      *ngFor="let item of products"
      class="bg-white shadow-md rounded-xl overflow-hidden border border-gray-100 flex flex-col"
    >
      <!-- Product Image -->
      <div class="w-full h-40 bg-gray-100 flex items-center justify-center overflow-hidden">
        <img
          *ngIf="item.image"
          [src]="item.image"
          alt="{{ item.name }}"
          class="w-full h-full object-contain"
        />

        <!-- Placeholder if no image -->
        <div
          *ngIf="!item.image"
          class="w-full h-full flex items-center justify-center text-4xl text-gray-400"
        >
          📦
        </div>
      </div>

      <!-- Card Body -->
      <div class="p-4 flex flex-col flex-1">
        <h2 class="text-lg font-semibold text-gray-800 mb-2 truncate">
          {{ item.name || 'Unnamed Product' }}
        </h2>

        <div class="text-sm text-gray-600 space-y-1 mb-4">
          <p><strong>SKU:</strong> {{ item.sku }}</p>
          <p><strong>Category:</strong> {{ item.category }}</p>
          <p><strong>Price:</strong> ₹{{ item.price }}</p>
          <p><strong>Stock:</strong> {{ item.stock }}</p>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-3 mt-auto pt-2">
          <button
            class="px-3 py-1.5 text-xs rounded-lg bg-blue-600 text-white shadow hover:bg-blue-700"
            (click)="handleAction({ type: 'edit', row: item })"
          >
            Edit
          </button>
          <button
            class="px-3 py-1.5 text-xs rounded-lg bg-red-500 text-white shadow hover:bg-red-600"
            (click)="handleAction({ type: 'delete', row: item })"
          >
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
